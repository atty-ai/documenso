name: Atty AI image

# Builds the Atty AI fork of Documenso and publishes it to GHCR.
# sign.atty.ai (Railway project atty-esign) runs ghcr.io/atty-ai/documenso:<tag>.
on:
  push:
    branches: ['atty/**']
  workflow_dispatch:

concurrency:
  group: atty-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          base="${GITHUB_REF_NAME#atty/}"            # e.g. v2.21.1
          short="$(git rev-parse --short=7 HEAD)"
          echo "list=ghcr.io/atty-ai/documenso:atty-${base},ghcr.io/atty-ai/documenso:atty-${base}-${short}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/atty-ai/documenso
            org.opencontainers.image.description=Documenso v2.21.1 with Atty AI branding (AGPL-3.0, source in this repository)
            org.opencontainers.image.licenses=AGPL-3.0
